<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ritesh Career Rewind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a playful year-in-review: big numbers, short lines, a wink, every figure true
   IDEA: the career as a tap-through story, one statistic per screen, ending in a shareable card
   PICTURE: each slide is a full-bleed colour field with large geometric shapes behind one huge number
   COLOUR and TYPE: one committed colour per slide (teal, amber, coral, violet, ink-blue) on near-black; Syne + Inter
   LAYOUT: a 9:16 story card centred on desktop, full screen on phones; progress bars on top, tap zones left/right */
:root{color-scheme:dark;--ink:#fff;--bg:#08090c}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;display:grid;place-items:center;overflow:hidden}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #fff;outline-offset:3px}

.stage{position:relative;width:min(100vw,calc(100dvh*9/16));height:min(100dvh,calc(100vw*16/9));max-height:100dvh;border-radius:18px;overflow:hidden;box-shadow:0 30px 90px #000c}
@media(max-width:600px){.stage{width:100vw;height:100dvh;border-radius:0}}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:72px 28px 56px;opacity:0;visibility:hidden;transition:opacity .45s ease}
.slide.on{opacity:1;visibility:visible}
.slide svg.art{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.slide>*:not(svg){position:relative;z-index:1}
.k{font-size:15px;font-weight:600;opacity:.85;margin:0 0 10px}
.huge{font:800 clamp(84px,30vw,148px)/.86 Syne,Inter,sans-serif;letter-spacing:-.02em;margin:0}
.unit{font:800 clamp(28px,8vw,40px)/1.05 Syne,Inter,sans-serif;margin:8px 0 14px;text-wrap:balance}
.t{font:800 clamp(34px,10vw,50px)/1.02 Syne,Inter,sans-serif;margin:0 0 14px;text-wrap:balance}
.p{font-size:17px;line-height:1.45;max-width:30ch;margin:0;opacity:.92}
.on .rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.on .rise.d1{animation-delay:.12s}.on .rise.d2{animation-delay:.24s}.on .rise.d3{animation-delay:.36s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}

/* progress */
.prog{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:4px;z-index:5}
.prog span{flex:1;height:3px;border-radius:2px;background:#ffffff4d;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#fff}
.top{position:absolute;top:26px;left:16px;right:12px;display:flex;align-items:center;justify-content:space-between;z-index:5}
.brand{font:800 15px/1 Syne,sans-serif;letter-spacing:.04em;text-decoration:none}
.ctl{display:flex;gap:4px}
.ctl button,.ctl a{width:40px;height:40px;border:0;border-radius:50%;background:#0000002e;color:#fff;display:grid;place-items:center;text-decoration:none}
.ctl svg{width:18px;height:18px}
.tap{position:absolute;top:70px;bottom:0;z-index:3;background:none;border:0;padding:0}
.tap.l{left:0;width:33%}.tap.r{right:0;width:67%}

/* lists */
.rank{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:12px}
.rank li{display:flex;align-items:baseline;gap:14px;font:700 clamp(22px,6.4vw,28px)/1.1 Syne,Inter,sans-serif}
.rank b{font-size:.8em;opacity:.6;width:1.2em}
.rank small{display:block;font:500 13px/1.3 Inter,sans-serif;opacity:.8;margin-top:3px}

/* summary card */
.card{background:#0e1114;border-radius:16px;padding:20px;display:grid;gap:14px;border:1px solid #ffffff1f}
.card h3{font:800 26px/1 Syne,sans-serif;margin:0}
.card .role{font-size:14px;opacity:.75;margin:-8px 0 0}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.cols h4{font-size:12px;font-weight:600;opacity:.65;margin:0 0 6px}
.cols ol{margin:0;padding-left:18px;font-size:14px;font-weight:600;line-height:1.55}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stats div{flex:1 1 30%;background:#ffffff0d;border-radius:10px;padding:8px 10px}
.stats b{display:block;font:800 22px/1 Syne,sans-serif;color:#34e0c0}
.stats span{font-size:11px;opacity:.75;line-height:1.25;display:block;margin-top:4px}
.btns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:14px;position:relative;z-index:4}
.btn{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:24px;font-weight:700;font-size:14px;text-decoration:none;border:0;padding:0 12px;text-align:center}
.btn.w{background:#fff;color:#08090c}.btn.g{background:#ffffff1f;color:#fff}
.btn.full{grid-column:1/-1}
.copied{font-size:13px;opacity:.8;min-height:1.3em;text-align:center;margin-top:6px;position:relative;z-index:4}
@media(prefers-reduced-motion:reduce){.slide{transition:none}.on .rise{animation:none}}
</style>
</head>
<body>
<main class="stage" id="stage" aria-roledescription="story" aria-label="Ritesh's Career Rewind">
  <div class="prog" id="prog"></div>
  <div class="top">
    <a class="brand" href="../">RITESH</a>
    <div class="ctl">
      <button id="pause" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
      <a href="../" aria-label="Close and go to portfolio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    </div>
  </div>
  <div id="slides"></div>
  <button class="tap l" id="tapL" aria-label="Previous slide"></button>
  <button class="tap r" id="tapR" aria-label="Next slide"></button>
</main>

<script>
{
// shape helpers: big flat geometry per slide
const circ=(cx,cy,r,f,o=1)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" opacity="${o}"/>`;
const rect=(x,y,w,h,f,rot=0,o=1)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="18" fill="${f}" opacity="${o}" transform="rotate(${rot} ${x+w/2} ${y+h/2})"/>`;
const art=(bg,shapes)=>`<svg class="art" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="360" height="640" fill="${bg}"/>${shapes}</svg>`;
const bars=(f)=>[40,64,52,88,76,120,150].map((h,i)=>`<rect x="${30+i*44}" y="${600-h}" width="30" height="${h}" rx="6" fill="${f}"/>`).join('');

const S=[
 {bg:'#0c5c53',ink:'#fff',art:circ(300,120,150,'#14a08e',.55)+circ(40,560,120,'#0a443d')+rect(210,430,200,200,'#2fd0b3',18,.35),
  html:`<p class="k rise">Career Rewind · 2026</p><h1 class="t rise d1">Ritesh, let's look back at your career so far.</h1><p class="p rise d2">Five roles, two side projects and a database you designed yourself. Tap to start.</p>`},
 {bg:'#e8a317',ink:'#1b1404',art:circ(330,90,170,'#f6c453',.8)+rect(-40,470,240,240,'#c98208',-14,.7),
  html:`<p class="k rise">Your top skill was</p><h2 class="huge rise d1">SQL</h2><p class="unit rise d2">used in 4 places</p><p class="p rise d3">Doclan, HIT – The Theatre, the Stampo app and the UK Retail Sales Analysis.</p>`},
 {bg:'#2b3fbf',ink:'#fff',art:bars('#5b6ef0')+circ(310,110,80,'#8fa0ff',.5),
  html:`<p class="k rise">At dnata you cut manual coordination by</p><h2 class="huge rise d1">60%+</h2><p class="unit rise d2">with Power Apps</p><p class="p rise d3">Nomination polls, dynamic pivots and charts, and automated workflows replaced the chasing.</p>`},
 {bg:'#d9483b',ink:'#fff',art:circ(60,130,140,'#f07a66',.7)+rect(170,420,240,240,'#a8291f',24,.7),
  html:`<p class="k rise">At Doclan, data processing got</p><h2 class="huge rise d1">50%</h2><p class="unit rise d2">faster</p><p class="p rise d3">Excel pivots, macros and formulas, plus SQL queries, VB scripts and batch files.</p>`},
 {bg:'#5b2a86',ink:'#fff',art:Array.from({length:12},(_,i)=>rect(24+(i%3)*112,150+Math.floor(i/3)*112,92,92,i<8?'#8d5bc1':'#3f1b62',0,i<8?.6:.9)).join(''),
  html:`<p class="k rise">You shipped</p><h2 class="huge rise d1">12</h2><p class="unit rise d2">SQL migrations</p><p class="p rise d3">for Stampo: 8 tables, 22 row-level security rules, and fraud-proof rewards that only work at the shop that gave the stamps.</p>`},
 {bg:'#0f6e64',ink:'#fff',art:circ(180,320,230,'#14a08e',.35)+circ(180,320,150,'#2fd0b3',.25),
  html:`<p class="k rise">One project, nine questions answered</p><h2 class="huge rise d1">9</h2><p class="unit rise d2">SQL analyses</p><p class="p rise d3">Revenue trends, customer segments, cohort retention and market-basket pairs, in the UK Retail Sales Analysis.</p>`},
 {bg:'#141a22',ink:'#fff',art:circ(330,600,180,'#e8a317',.25)+circ(20,80,110,'#2b3fbf',.35),
  html:`<p class="k rise">Your top tools</p><ol class="rank rise d1">
   <li><b>1</b><span>SQL<small>Doclan · HIT · Stampo · Retail analysis</small></span></li>
   <li><b>2</b><span>Excel &amp; VBA<small>Doclan · dnata</small></span></li>
   <li><b>3</b><span>MS Access<small>dnata · Doclan</small></span></li>
   <li><b>4</b><span>Power Apps<small>dnata</small></span></li>
   <li><b>5</b><span>PostgreSQL<small>Stampo on Supabase</small></span></li></ol>`},
 {bg:'#e8a317',ink:'#1b1404',art:circ(180,140,120,'#f6c453',.9)+rect(40,430,280,150,'#c98208',-6,.6),
  html:`<p class="k rise">Five years and counting at</p><h2 class="t rise d1">The Bhavan</h2><p class="unit rise d2">every weekend since 2021</p><p class="p rise d3">Salesforce, Shopify and LearnWorlds data, GDPR compliance, and month-end bank reconciliation, alongside full-time roles.</p>`},
 {bg:'#d9483b',ink:'#fff',art:rect(40,120,280,160,'#f07a66',-8,.6)+rect(60,380,260,160,'#a8291f',6,.7),
  html:`<p class="k rise">Your work personality is</p><h2 class="t rise d1">The Automator</h2><p class="p rise d2">Sees a task done by hand twice, then builds the macro, the query or the app so nobody does it a third time.</p>`},
 {bg:'#08090c',ink:'#fff',art:circ(320,60,120,'#0c5c53',.6)+circ(40,620,120,'#5b2a86',.5), summary:true,
  html:`<div class="card rise"><h3>Ritesh Shetty</h3><p class="role">Data &amp; Process Automation · Slough, UK</p>
   <div class="cols"><div><h4>Top tools</h4><ol><li>SQL</li><li>Excel &amp; VBA</li><li>MS Access</li><li>Power Apps</li><li>PostgreSQL</li></ol></div>
   <div><h4>Top projects</h4><ol><li>UK Retail Sales Analysis</li><li>Stampo</li></ol><h4 style="margin-top:10px">Education</h4><ol style="list-style:none;padding:0"><li>BSc (Hons) First Class</li></ol></div></div>
   <div class="stats"><div><b>60%+</b><span>less manual work at dnata</span></div><div><b>50%</b><span>faster processing at Doclan</span></div><div><b>12</b><span>SQL migrations shipped</span></div></div></div>
   <div class="btns rise d1"><a class="btn w" href="../">See portfolio</a><a class="btn g" href="../sheet/">Spreadsheet view</a><a class="btn g" href="https://www.linkedin.com/in/rks258">LinkedIn</a><a class="btn g" href="mailto:rworkrs@gmail.com">Email me</a><button class="btn g full" id="copy">Copy link to share</button><button class="btn g full" id="replay">Watch again</button></div>
   <p class="copied" id="copied" aria-live="polite"></p>`}
];

const slides=document.getElementById('slides'), prog=document.getElementById('prog');
slides.innerHTML=S.map((s,i)=>`<section class="slide" style="color:${s.ink}" aria-label="Slide ${i+1} of ${S.length}" aria-hidden="true">${art(s.bg,s.art)}${s.html}</section>`).join('');
prog.innerHTML=S.map(()=>'<span><i></i></span>').join('');
const els=[...slides.children], fills=[...prog.querySelectorAll('i')];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const DUR=6500;
let cur=0, start=0, elapsed=0, paused=false, raf=0;

function show(i){
  cur=Math.max(0,Math.min(S.length-1,i));
  els.forEach((e,k)=>{ const on=k===cur; e.classList.toggle('on',on); e.setAttribute('aria-hidden',!on); });
  fills.forEach((f,k)=>f.style.width = k<cur ? '100%' : '0%');
  document.querySelector('.top').style.color=S[cur].ink;
  // tap zones would sit over the summary buttons, so hide them there
  for(const id of ['tapL','tapR']) document.getElementById(id).style.display=S[cur].summary?'none':'';
  prog.style.setProperty('opacity', 1);
  elapsed=0; start=performance.now();
  try{ history.replaceState(null,'','#s'+(cur+1)); }catch(e){}
}
function tick(now){
  if(!paused && !S[cur].summary){
    const t=elapsed+(now-start);
    fills[cur].style.width=Math.min(100,t/DUR*100)+'%';
    if(t>=DUR) show(cur+1);
  } else if(S[cur].summary) fills[cur].style.width='100%';
  raf=requestAnimationFrame(tick);
}
function setPause(p){
  if(p===paused) return;
  if(p) elapsed+=performance.now()-start; else start=performance.now();
  paused=p;
  const b=document.getElementById('pause');
  b.setAttribute('aria-label',p?'Play':'Pause');
  b.innerHTML=p?'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l12 7-12 7z"/></svg>':'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
}
document.getElementById('tapL').addEventListener('click',()=>show(cur-1));
document.getElementById('tapR').addEventListener('click',()=>{ if(!S[cur].summary) show(cur+1); });
document.getElementById('pause').addEventListener('click',()=>setPause(!paused));
// hold to pause
let holdT=0;
const stage=document.getElementById('stage');
stage.addEventListener('pointerdown',e=>{ if(e.target.closest('.tap')) holdT=setTimeout(()=>setPause(true),250); });
stage.addEventListener('pointerup',()=>{ clearTimeout(holdT); });
// swipe
let sx=null;
stage.addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; },{passive:true});
stage.addEventListener('touchend',e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>60) show(cur+(dx<0?1:-1)); sx=null; });
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){ if(!S[cur].summary) show(cur+1); }
  else if(e.key==='ArrowLeft') show(cur-1);
  else if(e.key===' '){ e.preventDefault(); setPause(!paused); }
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden) setPause(true); });
// summary buttons
slides.addEventListener('click',async e=>{
  if(e.target.id==='replay'){ setPause(false); show(0); }
  if(e.target.id==='copy'){
    const url='https://rsts24.github.io/rewind/', out=document.getElementById('copied');
    try{ await navigator.clipboard.writeText(url); out.textContent='Link copied: '+url; }
    catch(err){ out.textContent='Share this link: '+url; }
  }
});
const m=location.hash.match(/^#s(\d+)$/);
show(m ? +m[1]-1 : 0);
if(reduce) setPause(true);
raf=requestAnimationFrame(tick);
}
</script>
</body>
</html>
